spring.application.name=backend
server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notelz}
spring.datasource.username=${DB_USER:notelz}
spring.datasource.password=${DB_PASSWORD:notelz}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

notelz.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-before-deploying-to-prod}
notelz.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

notelz.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
