<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Notelz — No one tells you what to study at the last minute, so we will.</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%238FAE8B%22/></svg>">
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="cover">

  <span class="blob blob-lavender"></span>
  <span class="blob blob-peach"></span>

  <!-- Top bar: brand left, auth right -->
  <header class="top-bar">
    <div class="brand">
      <div class="brand-mark">Note<span>lz</span></div>
      <div class="brand-sub">Est. for the diligent mind</div>
    </div>

    <div class="auth-actions">
      <button class="btn btn-ghost" id="loginBtn">Log In</button>
      <button class="btn btn-solid" id="signupBtn">Sign Up</button>
    </div>
  </header>

  <!-- Centre: nav tabs + vision -->
  <main class="notebook">

    <nav>
      <ul class="nav-tabs">
        <li><a href="#about">About</a></li>
        <li><a href="#blogs">Blogs</a></li>
        <li><a href="#services">Services</a></li>
        <li><a href="#notifications">Notifications</a></li>
        <li><a href="#notes" class="active">Notes</a></li>
      </ul>
    </nav>

    <svg class="emblem" viewBox="0 0 100 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M32 18 a18 18 0 1 0 36 0 a18 18 0 1 0 -36 0" stroke="#4F6B4C" stroke-width="2.5"/>
      <line x1="50" y1="36" x2="50" y2="78" stroke="#4F6B4C" stroke-width="2.5"/>
      <line x1="36" y1="60" x2="64" y2="60" stroke="#4F6B4C" stroke-width="2.5"/>
      <path d="M40 6 a10 10 0 0 0 20 0" stroke="#4F6B4C" stroke-width="2.5"/>
    </svg>

    <p class="eyebrow">Welcome to your notebook</p>

    <h1 class="vision"><span class="line">Study with clarity.</span><span class="line">Revise with confidence.</span></h1>

    <p class="motto">Everything you need to know, exactly when you need to know it.</p>

    <div class="cta-row">
      <button class="btn btn-solid">Open Your Notebook</button>
      <button class="btn btn-ghost">Explore Notelz</button>
    </div>

  </main>

  <footer class="foot-strip">
    <span>Notes <span class="dot"></span> Tutors <span class="dot"></span> Revision <span class="dot"></span> Progress</span>
    <span>&copy; 2026 Notelz</span>
  </footer>

</div>

<script src="script.js"></script>
</body>
</html>
